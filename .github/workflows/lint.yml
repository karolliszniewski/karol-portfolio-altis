name: Lint

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  php:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: content/themes/base
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --no-progress
      - run: composer run lint:php

  assets:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: content/themes/base
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run lint:css
      - run: npm run lint:js
